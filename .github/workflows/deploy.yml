name: Deploy / Cloudflare production

on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require production for manual deployment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/production'
        run: |
          echo 'Run production deployments from the production branch.' >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check -- --env=""
      - run: npm run check -- --env staging

  deploy:
    needs: check
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: openwebui-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy the existing Worker and container
        env:
          CLOUDFLARE_ACCOUNT_ID: b6ec751c0862027ba269faf7029b2501
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/openwebui/settings" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq --exit-status '[.result.bindings[] | select(.type == "secret_text") | .name] | contains(["DATABASE_URL", "WEBUI_SECRET_KEY"])'
          node node_modules/wrangler/bin/wrangler.js deploy --env=""
      - name: Verify public endpoints and database
        run: npm run verify
