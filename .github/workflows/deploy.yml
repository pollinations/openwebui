name: Deploy / Cloudflare production

on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      sync_database_url:
        description: Apply the approved production DATABASE_URL during deployment
        type: boolean
        default: false
      rollback_worker_version:
        description: Restore a previously deployed Worker version during cutover
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require production for manual deployment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/production'
        run: |
          echo 'Run production deployments from the production branch.' >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check -- --env=""
      - run: npm run check -- --env staging

  deploy:
    needs: check
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: openwebui-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy the existing Worker and container
        env:
          CLOUDFLARE_ACCOUNT_ID: b6ec751c0862027ba269faf7029b2501
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_database_url }}
          DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_database_url && secrets.DATABASE_URL || '' }}
          ROLLBACK_WORKER_VERSION: ${{ inputs.rollback_worker_version }}
        run: |
          check_secret_bindings() {
            curl --fail --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/openwebui/settings" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              | jq --exit-status '[.result.bindings[] | select(.type == "secret_text") | .name] | contains(["DATABASE_URL", "WEBUI_SECRET_KEY"])'
          }
          check_secret_bindings
          if [[ -n "$ROLLBACK_WORKER_VERSION" ]]; then
            if [[ "$SYNC_DATABASE_URL" == true || ! "$ROLLBACK_WORKER_VERSION" =~ ^[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}$ ]]; then
              echo 'Use a Worker version UUID and leave sync_database_url off for rollback.' >&2
              exit 1
            fi
            node node_modules/wrangler/bin/wrangler.js rollback "$ROLLBACK_WORKER_VERSION" --env="" --yes --message "Open WebUI database cutover rollback"
            check_secret_bindings
            exit
          fi
          deploy_args=()
          if [[ "$SYNC_DATABASE_URL" == true ]]; then
            if [[ -z "$DATABASE_URL" ]]; then
              echo 'DATABASE_URL is missing from the production environment.' >&2
              exit 1
            fi
            secret_file=$(mktemp)
            trap 'rm -f "$secret_file"' EXIT
            jq -n '{DATABASE_URL: env.DATABASE_URL}' > "$secret_file"
            unset DATABASE_URL
            deploy_args+=(--secrets-file "$secret_file")
          fi
          node node_modules/wrangler/bin/wrangler.js deploy --env="" "${deploy_args[@]}"
          check_secret_bindings
      - name: Verify public endpoints and database
        env:
          ROLLBACK_WORKER_VERSION: ${{ inputs.rollback_worker_version }}
        run: |
          if [[ -n "$ROLLBACK_WORKER_VERSION" ]]; then
            npm run verify -- --legacy
          else
            npm run verify
          fi
